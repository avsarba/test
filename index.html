<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    .card {
      text-align: center;
      padding: 60px 80px;
    }
    .title {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: 10px;
      background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 28px #00ff8855);
      line-height: 1;
    }
    .dim { color: #2a4a5a; letter-spacing: 18px; font-size: 13px; text-transform: uppercase; margin-top: 8px; margin-bottom: 56px; }
    a.play {
      display: inline-block;
      padding: 16px 64px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-decoration: none;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      border-radius: 100px;
      color: #050510;
      box-shadow: 0 0 50px #00ff8844, 0 4px 24px rgba(0,0,0,0.5);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    a.play:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 0 80px #00ff8877, 0 8px 30px rgba(0,0,0,0.5);
    }
    a.play:active { transform: scale(0.96); }
    .hint { margin-top: 24px; color: #1e3040; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">SNAKE</div>
    <div class="dim">3 D</div>
    <a class="play" href="snake3d.html">PLAY</a>
    <div class="hint">Arrow Keys &nbsp;·&nbsp; WASD &nbsp;·&nbsp; Touch</div>
  </div>
</body>
</html>
